<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>9C</title>
    <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/Kleinlauch/9C/main/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            var(--bg-dark): #050508;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.1);
            --accent-green: #39ff14;
            --accent-cyan: #00f0ff;
            --accent-purple: #bd00ff;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --danger: #ff0055;
        }

        body.lite-mode * { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; box-shadow: none !important; transition: none !important; animation: none !important; }
        body.lite-mode { background: #0a0a0a !important; }

        body {
            margin: 0; padding: 0 1.5rem 5rem 1.5rem; min-height: 100vh; width: 100vw;
            background: 
                radial-gradient(circle at 10% 20%, rgba(57, 255, 20, 0.12), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 240, 255, 0.12), transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(189, 0, 255, 0.08), transparent 60%),
                #050508;
            background-size: cover; background-attachment: fixed;
            font-family: 'Quicksand', sans-serif; color: var(--text-main);
            display: flex; flex-direction: column; align-items: center;
            box-sizing: border-box; overflow-x: hidden; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .main-wrapper {
            width: 100%; max-width: 1200px; display: flex; flex-direction: column; align-items: center; margin-top: 2rem;
        }

        /* UHR */
        .clock-container {
            font-size: 3.5rem; font-weight: 700; letter-spacing: 4px;
            color: #ffffff; text-shadow: 0 0 20px rgba(255,255,255,0.3); margin-bottom: 2rem;
            display: flex; justify-content: center; align-items: center;
        }
        @media (orientation: portrait) { .clock-container { display: none; } }
        .digit { display: inline-block; width: 1.1em; text-align: center; position: relative; height: 1.1em; overflow: hidden; }
        .digit-inner { display: flex; flex-direction: column; transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }

        h1.title { font-size: 4rem; font-weight: 700; letter-spacing: 6px; margin: 0 0 2rem 0; text-align: center; color: white; text-shadow: 0 0 25px rgba(255,255,255,0.4); }

        /* Schnellzugriff */
        .qa-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; width: 100%; margin-bottom: 2rem; }
        .qa-btn {
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
            border: 1px solid var(--glass-border); border-radius: 16px; padding: 1rem;
            color: var(--text-main); font-size: 1.1rem; font-family: 'Quicksand', sans-serif; font-weight: 600;
            cursor: pointer; backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            transition: all 0.3s ease; display: flex; align-items: center; gap: 12px; position: relative; box-shadow: 0 8px 32px rgba(0,0,0,0.2); overflow: hidden;
        }
        .qa-btn:hover { border-color: var(--accent-cyan); transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,240,255,0.2); color: var(--accent-cyan); }
        .qa-btn img, .qa-btn svg { width: 32px; height: 32px; object-fit: contain; border-radius: 8px; }
        .qa-info-btn {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.1);
            display: flex; justify-content: center; align-items: center; font-style: italic; transition: 0.2s; cursor: pointer; font-size: 14px;
        }
        .qa-info-btn:hover { background: var(--accent-cyan); color: #000; box-shadow: 0 0 15px var(--accent-cyan); }

        .fancy-divider { width: 100%; height: 2px; border: none; margin: 1rem 0 3rem 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), var(--accent-cyan), var(--accent-purple), rgba(255,255,255,0.2), transparent); }

        /* Dynamische Buttons */
        #button-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.2rem; width: 100%; }
        .glass-btn {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 18px;
            padding: 1.4rem; color: var(--text-main); font-size: 1.15rem; font-family: 'Quicksand', sans-serif;
            font-weight: 600; cursor: pointer; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); position: relative; overflow: hidden; word-wrap: break-word; outline: none;
        }
        .glass-btn:hover:not(:disabled) { background: var(--glass-hover); border-color: var(--accent-green); transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 20px rgba(57,255,20,0.3); color: var(--accent-green); }
        .glass-btn:disabled { background: rgba(255,255,255,0.01); color: #444; cursor: not-allowed; border-color: transparent; box-shadow: none; }

        /* Footer */
        .footer { position: fixed; bottom: 0; left: 0; width: 100%; padding: 10px 20px; display: flex; justify-content: space-between; box-sizing: border-box; pointer-events: none; z-index: 50; }
        .footer-text { font-size: 0.85rem; font-weight: 600; pointer-events: auto; }
        .footer-left { color: var(--text-muted); cursor: pointer; transition: 0.3s;}
        .footer-left:hover { color: white; text-shadow: 0 0 10px white; }
        .footer-right { color: var(--accent-cyan); cursor: pointer; transition: 0.3s; }
        .footer-right:hover { color: var(--accent-purple); text-shadow: 0 0 10px var(--accent-purple); }

        /* Changelog Bubble (PC) */
        .cl-bubble {
            position: fixed; bottom: 40px; left: 20px; width: 300px; background: rgba(10, 15, 20, 0.9);
            border: 1px solid var(--accent-cyan); border-radius: 16px; padding: 1rem; color: white;
            box-shadow: 0 10px 30px rgba(0,240,255,0.2); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 2000; font-family: 'Quicksand', sans-serif; transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0; transform: translateY(20px) scale(0.9); pointer-events: none;
        }
        .cl-bubble.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
        .cl-bubble.fade-out { opacity: 0; transform: translateY(10px) scale(0.95); transition: opacity 0.8s ease, transform 0.8s ease; }
        .cl-bubble-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 700; color: var(--accent-cyan); }
        .cl-bubble-close { cursor: pointer; color: var(--text-muted); font-weight: bold; transition: 0.2s; padding: 0 5px; }
        .cl-bubble-close:hover { color: var(--danger); }
        .cl-bubble-content { font-size: 0.9rem; color: var(--text-muted); max-height: 150px; overflow-y: auto; white-space: pre-wrap; }

        /* Floating Menu */
        .side-menu { position: fixed; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 100; }
        .menu-item { display: flex; align-items: center; background: rgba(10, 10, 15, 0.7); border: 1px solid var(--glass-border); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); padding: 12px; border-radius: 16px; cursor: pointer; color: white; transition: 0.3s; }
        .menu-item svg { width: 22px; height: 22px; flex-shrink: 0; }
        .menu-item span { display: none; margin-left: 10px; font-weight: 600; font-size: 0.95rem; white-space: nowrap; }
        .menu-item:hover { background: var(--glass-hover); border-color: var(--accent-cyan); color: var(--accent-cyan); }
        
        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; visibility: hidden; transition: 0.3s ease; padding: 1rem; box-sizing: border-box; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box { background: rgba(15, 15, 20, 0.9); border: 1px solid var(--glass-border); border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 450px; box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.05); transform: translateY(20px) scale(0.95); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); text-align: center; position: relative; max-height: 90vh; overflow-y: auto;}
        .modal-overlay.active .modal-box { transform: translateY(0) scale(1); }
        .modal-box.editor-mode { max-width: 800px; text-align: left; }
        .close-x { position: absolute; top: 15px; right: 15px; width: 30px; height: 30px; display: flex; justify-content: center; align-items: center; cursor: pointer; color: var(--text-muted); border-radius: 50%; transition: 0.2s; font-size: 1.2rem; font-weight: bold; }
        .close-x:hover { background: rgba(255,255,255,0.1); color: white; }
        .modal-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 1rem; color: white; }
        .modal-text { font-size: 1.1rem; line-height: 1.6; margin-bottom: 1.5rem; color: var(--text-muted); }
        .modal-input { width: 100%; padding: 14px 16px; background: rgba(0,0,0,0.6); margin-bottom: 1rem; border: 1px solid var(--glass-border); border-radius: 12px; color: white; font-size: 1.1rem; font-family: 'Quicksand', sans-serif; outline: none; transition: 0.3s; box-sizing: border-box;}
        .modal-input:focus { border-color: var(--accent-purple); box-shadow: 0 0 15px rgba(189,0,255,0.3); }
        .modal-actions { display: flex; gap: 1rem; justify-content: center; margin-top: 1.5rem; flex-wrap: wrap; }
        .modal-actions.right { justify-content: flex-end; }
        .modal-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: white; padding: 12px 24px; border-radius: 12px; cursor: pointer; font-size: 1.05rem; font-family: 'Quicksand', sans-serif; font-weight: 700; transition: 0.2s; flex: 1; min-width: 120px; }
        .modal-btn:hover { background: rgba(255,255,255,0.1); }
        .modal-btn.primary { background: var(--accent-cyan); color: #000; border-color: var(--accent-cyan); box-shadow: 0 0 15px rgba(0,240,255,0.4); }
        .modal-btn.primary:hover { background: #fff; box-shadow: 0 0 25px rgba(0,240,255,0.6); }

        /* Editor Liste */
        .editor-list { display: flex; flex-direction: column; gap: 0.8rem; margin-bottom: 1.5rem; }
        .editor-item { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); padding: 0.8rem 1.2rem; border-radius: 12px; border: 1px solid var(--glass-border); }
        .editor-item span { font-weight: 600; font-size: 1rem; word-break: break-all; margin-right: 10px;}
        .editor-actions { display: flex; gap: 0.5rem; flex-shrink: 0;}
        .icon-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 6px; border-radius: 8px; transition: 0.2s;}
        .icon-btn:hover { background: rgba(255,255,255,0.1); color: white; }
        
        .toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: rgba(10,10,15,0.95); border: 1px solid var(--accent-purple); color: #fff; padding: 12px 24px; border-radius: 30px; font-weight: 700; box-shadow: 0 5px 25px rgba(189,0,255,0.4); transition: top 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55); z-index: 2000; white-space: nowrap; }
        .toast.show { top: 20px; }

        .osk { position: fixed; bottom: -300px; left: 0; width: 100vw; background: rgba(10,15,20,0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--glass-border); padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; transition: bottom 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); z-index: 3000; }
        .osk.active { bottom: 0; }
        .osk-row { display: flex; justify-content: center; gap: 8px; }
        .osk-key { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.05); color: white; border-radius: 8px; padding: 12px; font-size: 1.2rem; cursor: pointer; flex: 1; text-align: center; font-weight: 600; }
        .osk-key:active { background: var(--accent-cyan); color: #000; }
        .osk-key.wide { flex: 2; } .osk-key.space { flex: 5; }

        @media (max-width: 768px) {
            h1.title { font-size: 3rem; }
            .side-menu { top: auto; bottom: 0; left: 0; right: 0; flex-direction: row; justify-content: space-around; background: rgba(5,5,8,0.9); border-top: 1px solid var(--glass-border); padding: 10px; }
            .menu-item { flex-direction: column; background: transparent; border: none; box-shadow: none; padding: 5px; gap: 5px; }
            .menu-item span { display: block; font-size: 0.75rem; margin: 0; }
            .footer { bottom: 70px; padding: 5px 15px; } /* Schiebt den Footer über die Mobile Navbar */
            body { padding-bottom: 120px; }
        }
        @media (min-width: 769px) { .menu-item span { display: inline; } .qa-container { grid-template-columns: repeat(4, 1fr); } }
    </style>
</head>

                <span>Taskcards</span>
            </button>
            <button class="qa-btn" onclick="window.open('https://drive.google.com/file/d/1KhgzMaZ0RfZgGxLH1c4nuWM7ZIktJmyg/preview', '_blank')">
                <svg viewBox="0 0 24 24" fill="none" stroke="#ffaa00" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>

    <!-- Universal Modals -->
    <div id="dialog-overlay" class="modal-overlay">
        <div class="modal-box" id="dialog-box">

    <!-- Server Sync -->
    <div id="sync-overlay" class="modal-overlay">
        <div class="modal-box" style="background:rgba(5,5,8,0.95);">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:20px;">
                <svg viewBox="0 0 24 24" width="50" fill="none" stroke="var(--accent-cyan)" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                <div style="flex-grow:1; height:6px; background:rgba(255,255,255,0.1); border-radius:5px; overflow:hidden; position:relative;">
                    <div style="width:50%; height:100%; background:var(--accent-purple); position:absolute; left:-50%; animation:syncMove 0.8s infinite linear;"></div>
                </div>
                <svg viewBox="0 0 24 24" width="50" fill="none" stroke="var(--accent-green)" stroke-width="1.5"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
            </div>

        </div>
    </div>
    <style>@keyframes syncMove { 0% {left:-50%;} 100% {left:100%;} }</style>

    <script>
        document.getElementById('lbl-version').textContent = CONFIG_VERSION;
        document.getElementById('lbl-server').textContent = CONFIG_SERVER_INFO;
        
        let currentUser = null, linksData = [], editorData = [], isDirty = false, activeInput = null;
        let changelogText = "Keine neuen Infos gefunden.";

        // --- OSK ---
        let shiftActive = false;
        document.addEventListener('contextmenu', e => {
            if (e.target.tagName === 'INPUT' && window.innerWidth > window.innerHeight) { e.preventDefault(); activeInput = e.target; document.getElementById('osk').classList.add('active'); }
            else e.preventDefault();
        });
        function typeKey(c) {
            if(!activeInput) return;
            if(c === 'Backspace') activeInput.value = activeInput.value.slice(0, -1);
            else if(c === 'Shift') shiftActive = !shiftActive;
            else { activeInput.value += shiftActive ? c.toUpperCase() : c.toLowerCase(); shiftActive = false; }
            activeInput.focus();
        }
        function oskEnter() { document.getElementById('osk').classList.remove('active'); if(activeInput) activeInput.dispatchEvent(new KeyboardEvent('keypress', {key: 'Enter'})); }

        function showToast(msg) {
            const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        // --- HILFSFUNKTIONEN ---
        async function sha512(s) { const b = await crypto.subtle.digest("SHA-512", new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join(''); }
        const setCookie = (n,v,d) => document.cookie = `${n}=${v||""}; max-age=${d*86400}; path=/; SameSite=Strict`;
        const getCookie = n => document.cookie.split('; ').find(r => r.startsWith(n+'='))?.split('=')[1] || null;
        const deleteCookie = n => document.cookie = `${n}=; max-age=0; path=/`;
        const sanitizeGist = s => s.replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t])).replace(/[;~\n\r]/g, ' ').trim();

        // --- TAB-TITEL ENGINE (Stundenplaner) ---
        let tabMode = 'intro'; // intro, run, away
        let tabStep = 0;
        let tabInterval;
        let lastBlink = 0;

        const introText = ["{ Willkommen }", "{ Guten Tag }", "Loading..."];
        const days = ["So.", "Mo.", "Di.", "Mi.", "Do.", "Fr.", "Sa."];
        
        function getSchoolSlot(date) {
            const h = date.getHours(), m = date.getMinutes(), d = date.getDay();
            const min = h * 60 + m;
            
            // Check Klingeln (Genaue Minuten für Blink)
            const klingelZeiten = [460, 505, 550, 570, 615, 620, 665, 680, 725, 730, 775]; 
            const mitKlingel = [775, 835, 930]; // MS
            if(klingelZeiten.includes(min) || ((d===1||d===2||d===4) && mitKlingel.includes(min))) {
                if(Date.now() - lastBlink > 60000) { lastBlink = Date.now(); return 'BLINK'; }
            }
            if(min < 460) return 'WAIT'; // Vor 07:40
            if(min < 505) return '1';
            if(min < 550) return '2';
            if(min < 570) return 'P1';
            if(min < 615) return '3';
            if(min < 620) return 'BRK1'; // 10:15 - 10:20
            if(min < 665) return '4';
            if(min < 680) return 'P2';
            if(min < 725) return '5';
            if(min < 730) return 'BRK2'; // 12:05 - 12:10
            if(min < 775) return '6'; // Endet 12:55

            if(d === 1 || d === 2 || d === 4) { // Mittagsschule (Mo, Di, Do)
                if(min < 835) return 'MP'; // 12:55 - 13:55
                if(min < 930) return 'MS'; // 13:55 - 15:30
            }
            return 'DONE'; // Nach der Schule
        }

        function updateTabTitle() {
            if(tabMode === 'away') { document.title = "9C |Efficiency Mode"; return; }
            if(tabMode === 'intro') {
                document.title = introText[tabStep]; tabStep++;
                if(tabStep >= introText.length) { tabMode = 'run'; tabStep = 0; }
                return;
            }

            const now = new Date();
            const slot = getSchoolSlot(now);
            
            if(slot === 'BLINK') { document.title = "■ ■ ■ KLINGELN ■ ■ ■"; return; }
            if(slot === 'WAIT') {
                document.title = tabStep % 2 === 0 ? "9C | Schulbeginn ausstehend" : "Was machst du hier???";
                tabStep++; return;
            }
            if(slot === 'DONE' || now.getDay() === 0 || now.getDay() === 6) {
                document.title = "Was machst du hier?"; return;
            }
            if(slot.startsWith('BRK')) {
                // Countdown berechnen. BRK1 endet 10:20 (620), BRK2 endet 12:10 (730)
                let endMin = slot === 'BRK1' ? 620 : 730;
                let msLeft = (endMin * 60000) - ((now.getHours()*60 + now.getMinutes())*60000 + now.getSeconds()*1000);
                let m = Math.floor(msLeft / 60000).toString().padStart(2,'0');
                let s = Math.floor((msLeft % 60000)/1000).toString().padStart(2,'0');
                document.title = `9C | BRK | ${m}:${s}`;
                return;
            }

            // Normaler Wechsel
            const timeStr = [now.getHours(), now.getMinutes(), now.getSeconds()].map(n=>n.toString().padStart(2,'0')).join(':');
            const dateStr = `${days[now.getDay()]} ${now.getDate()}.${now.getMonth()+1}.`;
            const texts = [`9C | ${slot} | ${dateStr}`, `9C | ${slot} | ${timeStr}`];
            
            if(['MP','MS'].includes(slot)) texts.push(`9C | ${slot} | Mittagsschule`);

            document.title = texts[tabStep % texts.length];
            tabStep++;
        }
        
        tabInterval = setInterval(updateTabTitle, 2000);
        window.addEventListener('blur', () => { tabMode = 'away'; updateTabTitle(); });
        window.addEventListener('focus', () => { tabMode = 'run'; tabStep = 0; updateTabTitle(); });


        // --- UHR LOGIK ---
        function updateClock() {
            if(window.innerHeight > window.innerWidth) return;
            const d = new Date(), t = [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => n.toString().padStart(2, '0')).join('');
            ['h1','h2','m1','m2','s1','s2'].forEach((id, i) => {
                const char = t[i], el = document.getElementById(id), spans = el.querySelectorAll('span');
                if (spans[0].textContent !== char) {
                    spans[1].textContent = char; el.querySelector('.digit-inner').style.transform = 'translateY(-1.1em)';
                    setTimeout(() => {
                        spans[0].textContent = char; el.querySelector('.digit-inner').style.transition = 'none';
                        el.querySelector('.digit-inner').style.transform = 'translateY(0)';
                        setTimeout(() => el.querySelector('.digit-inner').style.transition = 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)', 20);
                    }, 400);
                }
            });
        }
        setInterval(updateClock, 1000); updateClock();

        // --- Custom Dialog ---
        const Dialog = {
            overlay: document.getElementById('dialog-overlay'), box: document.getElementById('dialog-box'),
            title: document.getElementById('dialog-title'), text: document.getElementById('dialog-text'),
            inputs: document.getElementById('dialog-input-container'), actions: document.getElementById('dialog-actions'),
            closeX: document.getElementById('dialog-close'), resolvePromise: null,
            open(cfg) {
                return new Promise(res => {
                    this.resolvePromise = res; this.box.className = 'modal-box ' + (cfg.customClass||'');
                    this.title.textContent = cfg.title||''; this.text.innerHTML = cfg.text||'';
                    this.inputs.innerHTML = ''; this.actions.innerHTML = ''; this.actions.className = 'modal-actions ' + (cfg.alignActions||'');
                    if(cfg.showClose) { this.closeX.style.display = 'flex'; this.closeX.onclick = () => this.handleBtnClick('cancel'); } else this.closeX.style.display = 'none';
                    if (cfg.fields) {
                        cfg.fields.forEach((f, i) => {
                            if(f.label) { let l = document.createElement('label'); l.textContent = f.label; l.style.color="var(--text-muted)"; l.style.display="block"; l.style.marginBottom="5px"; this.inputs.appendChild(l); }
                            let inp = document.createElement('input'); inp.type = f.type || 'text'; inp.className = 'modal-input'; inp.placeholder = f.placeholder || ''; inp.value = f.value || '';
                            inp.addEventListener('keypress', (e) => { if(e.key === 'Enter') { e.preventDefault(); this.submit(cfg.buttons); } });
                            this.inputs.appendChild(inp); if (i === 0) setTimeout(() => inp.focus(), 50);
                        });
                    } else if(cfg.customHTML) this.inputs.innerHTML = cfg.customHTML;
                    if (cfg.buttons) {
                        cfg.buttons.forEach(b => {
                            let btn = document.createElement('button'); btn.className = 'modal-btn ' + (b.class||''); btn.textContent = b.text;
                            btn.onclick = () => this.handleBtnClick(b.action); this.actions.appendChild(btn);
                        });
                    }
                    this.overlay.classList.add('active');
                });
            },
            submit(btns) { const p = btns.find(b => b.class && b.class.includes('primary')) || btns[btns.length-1]; if(p) this.handleBtnClick(p.action); },
            handleBtnClick(a) {
                if (a === 'cancel') this.close(null);
                else if (a === 'ok') { const inps = Array.from(this.inputs.querySelectorAll('input')); if(inps.length===1) this.close(inps[0].value); else if(inps.length>1) this.close(inps.map(i=>i.value)); else this.close(true); }
                else if (typeof a === 'function') a(this);
            },
            close(v) { this.overlay.classList.remove('active'); setTimeout(() => { if (this.resolvePromise) { this.resolvePromise(v); this.resolvePromise = null; } }, 300); }
        };

        // --- SCHNELLZUGRIFF ---
        function showNCInfo() { Dialog.open({ title: 'Next Cloud Info', showClose: true, text: 'Auf dieser Seite meldest du dich mit deinen Zugangsdaten an, welche du auch für die Schul Computer verwendest. Danach kannst du auf deine Dateien zugreifen.', buttons: [{text: 'Weiter zu Next Cloud', class: 'primary', action: () => { Dialog.close(); window.open('https://nc.schillerschuledettingen.de/nextcloud/login', '_blank'); }}] }); }
        
        function getOSInstructions() {
            let ua = navigator.userAgent;
            if (/iPad|iPhone|iPod/.test(ua)) return "Textfeld gedrückt halten oder doppeltippen, dann auf <b>Einsetzen</b> tippen.";
            if (/Android/.test(ua)) return "Textfeld gedrückt halten und auf <b>Einfügen</b> tippen.";
            if (/Mac/.test(ua)) return "<b>CMD + V</b> drücken oder Rechtsklick -> <b>Einsetzen</b> wählen.";
            return "<b>STRG + V</b> drücken oder Rechtsklick -> <b>Einfügen</b> wählen.";
        }

        function showTaskcardsPopup() {
            Dialog.open({
                title: 'Weiterleitung zu Taskcards', showClose: true,
                text: `Du wirst im folgenden zu Taskcards weitergeleitet, im Passwort Feld musst du nur folgendes tun:<br><br><span style="color:var(--accent-cyan)">${getOSInstructions()}</span>`,
                buttons: [{text: 'Weiter zu Taskcards', class: 'primary', action: () => {
                    navigator.clipboard.writeText("9cEnglish2627").then(()=>{ Dialog.close(); window.open('https://www.taskcards.de/#/board/10eca93a-de74-456c-beaa-3841592ff1eb/view?token=75a6af1a-571e-47e7-bbc1-f26c6f9397c0', '_blank'); }).catch(()=>{alert("Fehler beim Kopieren.");});
                }}]
            });
        }

        // --- LEHRER POPUP (Clipboard bedingt expliziten Klick) ---
        function showTeacherPopup() {
            Dialog.open({
                title: 'Hallo Frau Stephan!', showClose: false,
                text: 'Bitte klicken Sie auf den Button, um das Passwort sicher zu kopieren und Taskcards zu öffnen.',
                buttons: [{
                    text: 'Passwort kopieren & Weiter', class: 'primary', action: () => {
                        navigator.clipboard.writeText("9cEnglish2627").then(() => {
                            window.location.href = 'https://www.taskcards.de/#/board/10eca93a-de74-456c-beaa-3841592ff1eb/view?token=75a6af1a-571e-47e7-bbc1-f26c6f9397c0';
                        }).catch(() => alert("Fehler beim Kopieren."));
                    }
                }]
            });
        }

        // --- CHANGELOG BUBBLE ---
        let bubbleTimer;
        async function loadChangelog() {
            if(CONFIG_CHANGELOG !== "ON") return;
            try {
                const res = await fetch(GIST_CHANGELOG + "?t=" + Date.now());
                if(res.ok) changelogText = await res.text();
                document.getElementById('cl-bubble-text').textContent = changelogText;
                
                // Show initially if on PC and no params
                if(window.innerWidth > 768 && window.location.search === '') {
                    setTimeout(() => {
                        const b = document.getElementById('cl-bubble'); b.classList.add('show');
                        startBubbleTimer();
                    }, 1000);
                }
            } catch(e) {}
        }
        function startBubbleTimer() { clearTimeout(bubbleTimer); bubbleTimer = setTimeout(closeBubble, 5000); }
        function clearBubbleTimer() { clearTimeout(bubbleTimer); }
        function closeBubble() {
            const b = document.getElementById('cl-bubble');
            if(b.classList.contains('show')) {
                b.classList.add('fade-out');
                setTimeout(() => { b.classList.remove('show'); b.classList.remove('fade-out'); }, 800);
            }
        }
        function showChangelog() {
            if(window.innerWidth <= 768) {
                Dialog.open({title: 'Das ist Neu', showClose: true, text: `<div style="text-align:left; white-space:pre-wrap; font-size:0.9rem;">${changelogText}</div>`, buttons: []});
            } else {
                clearBubbleTimer();
                document.getElementById('cl-bubble').classList.add('show');
                document.getElementById('cl-bubble').classList.remove('fade-out');
            }
        }


        // --- INIT ---
        window.onload = () => {
            const up = new URLSearchParams(window.location.search);
            if (up.has('user') && up.has('password')) {
                currentUser = up.get('user').toUpperCase(); setCookie('9c_user', currentUser, 7); showToast(`Angemeldet als: ${currentUser}`);
                window.history.replaceState({}, document.title, window.location.pathname); updateMenu();
            } else if (window.location.search.includes('st-tc')) {
                showTeacherPopup();
            } else {
                const cUser = getCookie('9c_user'); if(cUser) { currentUser = cUser; showToast(`Angemeldet als: ${currentUser}`); updateMenu(); }
            }
            loadLinks(); loadChangelog();
        };

        // --- AUTH & MENÜ ---
        document.getElementById('btn-user').onclick = async () => {
            if (currentUser) {
                if(currentUser === 'LOCAL') { Dialog.open({ title:'Hinweis', text:'Local-Passwort unveränderlich.', buttons:[{text:'OK',class:'primary',action:'cancel'}]}); return; }
                const c = await Dialog.open({ title:'Passwort ändern?', buttons:[{text:'Abbrechen',action:'cancel'}, {text:'Ja',class:'primary',action:'ok'}]});
                if(c) {
                    const p = await Dialog.open({title:'Neues Passwort', fields:[{type:'password', placeholder:'Neu'}], buttons:[{text:'Abbrechen',action:'cancel'},{text:'Ändern',class:'primary',action:'ok'}]});
                    if(p) triggerServerSync("9C-CHANGE-PASS", `${currentUser}%3B${await sha512(p)}`, () => Dialog.open({title:'Erfolg', text:'Geändert!', buttons:[{text:'OK',class:'primary',action:'cancel'}]}));
                }
            } else {
                const u = await Dialog.open({ title:'Anmelden', fields:[{placeholder:'Benutzername'}], buttons:[{text:'Abbrechen',action:'cancel'}, {text:'Weiter',class:'primary',action:'ok'}]});
                if(!u) return; const un = sanitizeGist(u.toUpperCase());
                if(un === 'LOCAL') { checkPass(un, "08a06925eb603fb9d2caef4cbff40659a449ae3ac6ca26c561632c53e603e6825fb2bf9d4e863dc4f26d522cdc49690d66a509739e31f7ef060931a2ec042d64"); return; }
                try {
                    const txt = await(await fetch(GIST_USERS+"?t="+Date.now())).text(); let h = null;
                    txt.split('\n').forEach(l=>{ let p=l.split(';'); if(p[0]===un) h=p[1]?.trim()||null; });
                    if(h===null) Dialog.open({title:'Fehler', text:'User nicht gefunden', buttons:[{text:'OK',class:'danger',action:'cancel'}]});
                    else if(h==='-') {
                        const np = await Dialog.open({title:'Account neu', text:'Passwort festlegen:', fields:[{type:'password',placeholder:'Neu'}], buttons:[{text:'Abbruch',action:'cancel'},{text:'Festlegen',class:'primary',action:'ok'}]});
                        if(np) triggerServerSync("9C-EDIT-REGISTER", `${un}%3B${await sha512(np)}`, () => { currentUser=un; setCookie('9c_user',un,7); updateMenu(); showToast('Angemeldet'); });
                    } else checkPass(un, h);
                } catch(e) { Dialog.open({title:'Fehler', text:'Gist Error', buttons:[{text:'OK',class:'danger',action:'cancel'}]}); }
            }
        };

        async function checkPass(u, ch) {
            const p = await Dialog.open({title:'Anmelden', text:`Hallo ${u}!`, fields:[{type:'password',placeholder:'Passwort'}], buttons:[{text:'Abbruch',action:'cancel'},{text:'Anmelden',class:'primary',action:'ok'}]});
            if(!p) return;
            if(await sha512(p) === ch) { currentUser=u; setCookie('9c_user',u,7); updateMenu(); showToast('Angemeldet!'); }
            else Dialog.open({title:'Fehler', text:'Falsch', buttons:[{text:'OK',class:'danger',action:'cancel'}]});
        }

        document.getElementById('btn-signout').onclick = () => { deleteCookie('9c_user'); currentUser=null; updateMenu(); showToast('Abgemeldet'); };

        function updateMenu() {
            document.getElementById('btn-edit').style.display = currentUser ? 'flex' : 'none';
            document.getElementById('btn-links-add').style.display = currentUser ? 'flex' : 'none';
            document.getElementById('btn-signout').style.display = currentUser ? 'flex' : 'none';
            document.getElementById('user-label').textContent = currentUser ? currentUser.charAt(0)+currentUser.slice(1).toLowerCase() : 'Benutzer';
            document.getElementById('btn-user').style.color = currentUser ? 'var(--accent-cyan)' : 'white';
        }

        // --- GIST SYNC ---
        async function triggerServerSync(shortcut, payload, cb) {
            document.getElementById('sync-overlay').classList.add('active');
            try { await fetch(PUSHCUT_BASE + shortcut + "&input=" + payload, {mode:'no-cors'});
                setTimeout(()=>{ document.getElementById('sync-overlay').classList.remove('active'); setTimeout(cb,400); }, 1500); // Fake delay for animation
            } catch(e) { document.getElementById('sync-overlay').classList.remove('active'); alert("Server Error"); }
        }

        // --- GIST LINKS LOAD ---
        async function loadLinks() {
            const cont = document.getElementById('button-container'); cont.innerHTML = '';
            try {
                const txt = await(await fetch(GIST_LINKS+"?t="+Date.now())).text(); linksData = [];
                txt.split('\n').forEach(l=>{
                    l=l.trim(); if(!l)return; let p=l.split(';-;'); if(p.length<2)return;
                    let lbl=p[0].trim(), pwd='-', tFull='';
                    if(p.length===2) tFull=p[1].trim(); else {pwd=p[1].trim()||'-'; tFull=p.slice(2).join(';-;').trim();}
                    let tgt=tFull, pop=''; let s=tFull.indexOf(';'); if(s!==-1){tgt=tFull.substring(0,s); pop=tFull.substring(s+1);}
                    linksData.push({label:lbl, password:pwd, target:tgt, popupText:pop});
                    const b = document.createElement('button'); b.className='glass-btn'; b.textContent=lbl;
                    if(tgt.toUpperCase()==='X') b.disabled=true; else b.onclick=()=>handleLinkClick(lbl,pwd,tgt,pop);
                    cont.appendChild(b);
                });
            } catch(e){}
        }

        async function handleLinkClick(lbl, pwd, tgt, pop) {
            if(pwd!=='-' && pwd!=='') {
                const i = await Dialog.open({title:'Geschützt', showClose:true, text:`Passwort für ${lbl}:`, fields:[{type:'password',placeholder:'PW'}], buttons:[{text:'Abbruch',action:'cancel'},{text:'OK',class:'primary',action:'ok'}]});
                if(!i)return; if(i!==pwd) { Dialog.open({title:'Fehler', showClose:true, text:'Falsch!', buttons:[{text:'OK',class:'danger',action:'cancel'}]}); return; }
            }
            if(tgt.toLowerCase().startsWith('http')) {
                if(pop) { const ok = await Dialog.open({title:lbl, showClose:true, text:pop, buttons:[{text:'Abbruch',action:'cancel'},{text:'Weiter',class:'primary',action:'ok'}]}); if(ok) window.open(tgt,'_blank'); }
                else window.open(tgt,'_blank');
            } else Dialog.open({title:lbl, showClose:true, text:tgt, buttons:[{text:'OK',class:'primary',action:'cancel'}]});
        }

        // --- EDITOR & QUICK ADD ---
        document.getElementById('btn-links-add').onclick = () => {
            Dialog.open({
                title:'Neuer Button', showClose:true,
                fields:[{label:'Label*',placeholder:'Name'},{label:'Passwort (- für keins)',value:'-'},{label:'Link*',placeholder:'https://...'},{label:'Hinweis (- für keins)',value:'-'}],
                buttons:[{text:'Abbrechen',action:'cancel'},{text:'Speichern',class:'primary',action: dlg=>{
                    const v=dlg.inputs.querySelectorAll('input'); const l=sanitizeGist(v[0].value), p=sanitizeGist(v[1].value)||'-', t=sanitizeGist(v[2].value), h=sanitizeGist(v[3].value)||'-';
                    if(!l||!t){alert("Label/Link fehlen!");return;}
                    Dialog.close(); triggerServerSync("9C-ADD", encodeURIComponent(`${l};${p};${t};${h}`), ()=>{ Dialog.open({title:'Erfolg',text:'Hinzugefügt.',buttons:[]}); setTimeout(()=>location.reload(),2000); });
                }}]
            });
        };

        document.getElementById('btn-edit').onclick = () => { editorData = JSON.parse(JSON.stringify(linksData)); isDirty = false; renderEditor(); };
        function renderEditor() {
            let h = '<div class="editor-list">';
            editorData.forEach((l, i) => {
                h += `<div class="editor-item"><span>${sanitizeGist(l.label)}</span>
                        <div class="editor-actions">
                            <button class="icon-btn" onclick="editItem(${i})"><svg viewBox="0 0 24 24" width="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
                            <button class="icon-btn delete" onclick="deleteItem(${i})"><svg viewBox="0 0 24 24" width="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6"/></svg></button>
                        </div></div>`;
            }); h += '</div>';
            Dialog.open({ title: 'Editor', customClass: 'editor-mode', customHTML: h, buttons: [ { text: 'Schließen', action: checkDirtyClose }, { text: '+ Neu', action: () => editItem(-1) }, { text: 'Speichern', class: 'primary', action: saveGist } ] });
        }
        function editItem(i) {
            const isN = i===-1; const it = isN ? {label:'',password:'-',target:'',popupText:''} : editorData[i];
            Dialog.open({
                title: isN ? 'Neu' : 'Bearbeiten', customClass: 'editor-mode',
                fields: [{label:'Label*',value:it.label}, {label:'Passwort (- = keins)',value:it.password}, {label:'Link (X = aus)*',value:it.target}, {label:'Hinweis (- = keins)',value:it.popupText||'-'}],
                buttons: [{text:'Abbrechen',action:renderEditor}, {text:'Übernehmen',class:'primary',action:dlg=>{
                    const v=dlg.inputs.querySelectorAll('input'); const nL=sanitizeGist(v[0].value), nP=sanitizeGist(v[1].value)||'-', nT=sanitizeGist(v[2].value), nU=sanitizeGist(v[3].value)==='-'?'':sanitizeGist(v[3].value);
                    if(!nL||!nT) {alert("Label/Link!");return;}
                    isN ? editorData.push({label:nL,password:nP,target:nT,popupText:nU}) : editorData[i]={label:nL,password:nP,target:nT,popupText:nU};
                    isDirty=true; renderEditor();
                }}]
            });
        }
        function deleteItem(i) { editorData.splice(i,1); isDirty=true; renderEditor(); }
        async function checkDirtyClose(dlg) {
            if(!isDirty){dlg.close();return;}
            const c=await Dialog.open({title:'Ungespeichert',text:'Schließen ohne speichern?',buttons:[{text:'Zurück',action:'cancel'},{text:'Verwerfen',class:'danger',action:'ok'}]});
            if(c){isDirty=false;Dialog.close();} else renderEditor();
        }
        function saveGist(dlg) {
            if(!isDirty){dlg.close();return;}
            let ls = editorData.map(l => l.password!=='-'&&l.password!=='' ? `${l.label};-;\${l.password};-;\${l.target}${l.popupText?';'+l.popupText:''}` : `${l.label};-;\${l.target}${l.popupText?';'+l.popupText:''}`);
            Dialog.close(); triggerServerSync("9C-EDIT-APPLY", encodeURIComponent(ls.join('\n')), ()=>location.reload());
        }

    </script>
</body>
</html>

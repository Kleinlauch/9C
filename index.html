<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>9C</title>
    <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/Kleinlauch/9C/main/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Bunter, moderner Glass-Look */
            --bg-dark: #050508;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.1);
            
            --accent-green: #39ff14;
            --accent-cyan: #00f0ff;
            --accent-purple: #bd00ff;
            
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --danger: #ff0055;
            --nav-height: 70px;
        }

        body.lite-mode * { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; box-shadow: none !important; transition: none !important; animation: none !important; }
        body.lite-mode { background: #0a0a0a !important; }

        body {
            margin: 0; padding: 0 1.5rem 5rem 1.5rem; min-height: 100vh; width: 100vw;
            background: 
                radial-gradient(circle at 10% 20%, rgba(57, 255, 20, 0.12), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 240, 255, 0.12), transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(189, 0, 255, 0.08), transparent 60%),
                var(--bg-dark);
            background-size: cover; background-attachment: fixed;
            font-family: 'Quicksand', sans-serif; color: var(--text-main);
            display: flex; flex-direction: column; align-items: center;
            box-sizing: border-box; overflow-x: hidden; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .main-wrapper {
            width: 100%; max-width: 1200px; display: flex; flex-direction: column; align-items: center;
            margin-top: 2rem;
        }

        /* UHR */
        .clock-container {
            font-size: 3.5rem; font-weight: 700; letter-spacing: 4px;
            color: #ffffff; text-shadow: 0 0 20px rgba(255,255,255,0.3); margin-bottom: 2rem;
            display: flex; justify-content: center; align-items: center;
        }
        @media (orientation: portrait) { .clock-container { display: none; } }
        .digit { display: inline-block; width: 1.1em; text-align: center; position: relative; height: 1.1em; overflow: hidden; }
        .digit-inner { display: flex; flex-direction: column; transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }

        h1.title {
            font-size: 4rem; font-weight: 700; letter-spacing: 6px; margin: 0 0 2rem 0;
            text-align: center; color: white; text-shadow: 0 0 25px rgba(255,255,255,0.4);
        }

        /* Schnellzugriff */
        .qa-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; width: 100%; margin-bottom: 2rem; }
        .qa-btn {
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
            border: 1px solid var(--glass-border); border-radius: 16px; padding: 1rem;
            color: var(--text-main); font-size: 1.1rem; font-family: 'Quicksand', sans-serif; font-weight: 600;
            cursor: pointer; backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            transition: all 0.3s ease; display: flex; align-items: center; gap: 12px; position: relative;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2); overflow: hidden;
        }
        .qa-btn:hover { border-color: var(--accent-cyan); transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,240,255,0.2); color: var(--accent-cyan); }
        .qa-btn img, .qa-btn svg { width: 32px; height: 32px; object-fit: contain; border-radius: 8px; }
        .qa-info-btn {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.1);
            display: flex; justify-content: center; align-items: center; font-style: italic;
            transition: 0.2s; cursor: pointer; font-size: 14px;
        }
        .qa-info-btn:hover { background: var(--accent-cyan); color: #000; box-shadow: 0 0 15px var(--accent-cyan); }

        .fancy-divider {
            width: 100%; height: 2px; border: none; margin: 1rem 0 3rem 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), var(--accent-cyan), var(--accent-purple), rgba(255,255,255,0.2), transparent);
        }

        /* Dynamische Buttons */
        #button-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.2rem; width: 100%; }
        .glass-btn {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 18px;
            padding: 1.4rem; color: var(--text-main); font-size: 1.15rem; font-family: 'Quicksand', sans-serif;
            font-weight: 600; cursor: pointer; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            position: relative; overflow: hidden; word-wrap: break-word; outline: none;
        }
        .glass-btn:hover:not(:disabled) {
            background: var(--glass-hover); border-color: var(--accent-green); transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 20px rgba(57,255,20,0.3); color: var(--accent-green);
        }
        .glass-btn:disabled { background: rgba(255,255,255,0.01); color: #444; cursor: not-allowed; border-color: transparent; box-shadow: none; }

        /* Footer & Nav */
        .footer {
            position: fixed; bottom: 0; left: 0; width: 100%; padding: 10px 20px;
            display: flex; justify-content: space-between; box-sizing: border-box; pointer-events: none; z-index: 50;
        }
        .footer-text { font-size: 0.85rem; font-weight: 600; pointer-events: auto; }
        .footer-left { color: var(--text-muted); position: relative; }
        .footer-right { color: var(--accent-cyan); cursor: pointer; transition: 0.3s; }
        .footer-right:hover { color: var(--accent-purple); text-shadow: 0 0 10px var(--accent-purple); }

        .side-menu { position: fixed; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 100; }
        .menu-item {
            display: flex; align-items: center; background: rgba(10, 10, 15, 0.7);
            border: 1px solid var(--glass-border); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 12px; border-radius: 16px; cursor: pointer; color: white; transition: 0.3s;
        }
        .menu-item svg { width: 22px; height: 22px; flex-shrink: 0; }
        .menu-item span { display: none; margin-left: 10px; font-weight: 600; font-size: 0.95rem; white-space: nowrap; }
        .menu-item:hover { background: var(--glass-hover); border-color: var(--accent-cyan); color: var(--accent-cyan); }
        .menu-item.danger:hover { border-color: var(--danger); color: var(--danger); }

        /* Modals & Dialogs */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
            opacity: 0; visibility: hidden; transition: 0.3s ease; padding: 1rem; box-sizing: border-box;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box {
            background: rgba(15, 15, 20, 0.9); border: 1px solid var(--glass-border); border-radius: 20px;
            padding: 2.5rem; width: 100%; max-width: 450px; box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.05);
            transform: translateY(20px) scale(0.95); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); text-align: center; position: relative;
            max-height: 90vh; overflow-y: auto;
        }
        .modal-overlay.active .modal-box { transform: translateY(0) scale(1); }
        .modal-box.editor-mode { max-width: 800px; text-align: left; }
        
        .close-x {
            position: absolute; top: 15px; right: 15px; width: 30px; height: 30px;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            color: var(--text-muted); border-radius: 50%; transition: 0.2s; font-size: 1.2rem; font-weight: bold;
        }
        .close-x:hover { background: rgba(255,255,255,0.1); color: white; }

        .modal-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 1rem; color: white; }
        .modal-text { font-size: 1.1rem; line-height: 1.6; margin-bottom: 1.5rem; color: var(--text-muted); }

        .input-wrapper { position: relative; width: 100%; margin-bottom: 1rem; }
        .modal-input {
            width: 100%; padding: 14px 45px 14px 16px; background: rgba(0,0,0,0.6);
            border: 1px solid var(--glass-border); border-radius: 12px; color: white;
            font-size: 1.1rem; font-family: 'Quicksand', sans-serif; outline: none; transition: 0.3s; box-sizing: border-box;
        }
        .modal-input:focus { border-color: var(--accent-purple); box-shadow: 0 0 15px rgba(189,0,255,0.3); }
        .eye-icon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted); padding: 5px; }
        .eye-icon:hover { color: var(--accent-cyan); }

        .modal-actions { display: flex; gap: 1rem; justify-content: center; margin-top: 1.5rem; flex-wrap: wrap; }
        .modal-actions.right { justify-content: flex-end; }
        .modal-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: white;
            padding: 12px 24px; border-radius: 12px; cursor: pointer; font-size: 1.05rem;
            font-family: 'Quicksand', sans-serif; font-weight: 700; transition: 0.2s; flex: 1; position: relative; overflow: hidden;
        }
        .modal-btn:hover { background: rgba(255,255,255,0.1); }
        .modal-btn.primary { background: var(--accent-cyan); color: #000; border-color: var(--accent-cyan); box-shadow: 0 0 15px rgba(0,240,255,0.4); }
        .modal-btn.primary:hover { background: #fff; box-shadow: 0 0 25px rgba(0,240,255,0.6); }
        .modal-btn.danger { background: rgba(255,0,85,0.1); color: var(--danger); border-color: var(--danger); }
        .modal-btn.danger:hover { background: var(--danger); color: white; box-shadow: 0 0 15px rgba(255,0,85,0.4); }

        /* Outline Progress Bar Button (Taskcards) */
        .btn-outline-progress {
            background: transparent !important; color: white !important; border: 1px solid var(--accent-cyan) !important;
            box-shadow: none !important; position: relative; overflow: hidden;
        }
        .progress-fill {
            position: absolute; top: 0; left: 0; height: 100%; width: 0%;
            background: rgba(0, 240, 255, 0.3); z-index: 1; transition: width 3s linear;
        }
        .btn-text-front { position: relative; z-index: 2; }

        /* Changelog Bubble */
        .changelog-bubble {
            position: absolute; bottom: 30px; left: 0; width: 320px;
            background: rgba(20, 20, 25, 0.9); border: 1px solid var(--accent-cyan); border-radius: 16px;
            padding: 15px; box-shadow: 0 10px 30px rgba(0,240,255,0.2); z-index: 60;
            transform-origin: bottom left; transform: scale(0.5); opacity: 0; pointer-events: none;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
        }
        .changelog-bubble.show { transform: scale(1); opacity: 1; pointer-events: auto; }
        .cl-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid var(--glass-border); padding-bottom: 5px; }
        .cl-title { font-weight: 700; color: var(--accent-cyan); font-size: 1.1rem; }
        .cl-close { cursor: pointer; color: var(--text-muted); font-size: 1.2rem; transition: 0.2s; }
        .cl-close:hover { color: white; }
        .cl-content { font-size: 0.95rem; color: var(--text-muted); white-space: pre-wrap; line-height: 1.4; max-height: 200px; overflow-y: auto; }

        /* Editor Liste */
        .editor-list { display: flex; flex-direction: column; gap: 0.8rem; }
        .editor-item { 
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(0,0,0,0.4); padding: 1rem 1.2rem; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05);
        }
        .editor-item span { font-weight: 700; font-size: 1rem; word-break: break-all; margin-right: 10px;}
        .editor-actions { display: flex; gap: 0.5rem; flex-shrink: 0;}
        .icon-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 8px; border-radius: 10px; transition: 0.2s;}
        .icon-btn:hover { background: rgba(255,255,255,0.1); color: white; }
        .icon-btn.delete:hover { background: rgba(255,0,85,0.2); color: var(--danger); }

        /* Toast */
        .toast {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: rgba(10,10,15,0.95); border: 1px solid var(--accent-purple); color: #fff;
            padding: 12px 24px; border-radius: 30px; font-weight: 700; box-shadow: 0 5px 25px rgba(189,0,255,0.4);
            transition: top 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55); z-index: 2000;
        }
        .toast.show { top: 20px; }

        /* On-Screen Keyboard */
        .osk {
            position: fixed; bottom: -300px; left: 0; width: 100vw; background: rgba(10,15,20,0.95);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--glass-border);
            padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px;
            transition: bottom 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); z-index: 3000;
        }
        .osk.active { bottom: 0; }
        .osk-row { display: flex; justify-content: center; gap: 8px; }
        .osk-key {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.05); color: white;
            border-radius: 8px; padding: 12px; font-size: 1.2rem; cursor: pointer; flex: 1; text-align: center;
            font-family: 'Quicksand', sans-serif; font-weight: 600;
        }
        .osk-key:active { background: var(--accent-cyan); color: #000; }
        .osk-key.wide { flex: 2; } .osk-key.space { flex: 5; }

        @media (max-width: 768px) {
            h1.title { font-size: 3rem; }
            .side-menu {
                top: auto; bottom: 0; left: 0; right: 0; flex-direction: row; justify-content: space-around;
                background: rgba(5,5,8,0.9); border-top: 1px solid var(--glass-border); padding: 10px;
            }
            .menu-item { flex-direction: column; background: transparent; border: none; box-shadow: none; padding: 5px; gap: 5px; }
            .menu-item span { display: block; font-size: 0.75rem; margin: 0; }
            /* Footer Fix für Mobile */
            .footer { bottom: var(--nav-height); padding: 8px 15px; }
            .footer-text { font-size: 0.75rem; }
            .changelog-bubble { bottom: 35px; width: 250px; }
            body { padding-bottom: calc(var(--nav-height) + 40px); }
        }
        @media (min-width: 769px) {
            .menu-item span { display: inline; }
            .qa-container { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>

    <script>

        const CONFIG_SERVER_INFO = "Server Status: Online";
        const CONFIG_CHANGELOG = "ON"; // "ON" oder "OFF"

    </script>

    <!-- Footer -->

    <!-- Navigation -->
    <div class="side-menu" id="side-menu">
        <div class="menu-item" id="btn-user">

            <span id="user-label">Benutzer</span>

        <div class="menu-item" id="btn-edit" style="display: none;">

    <div class="osk" id="osk">

        <div class="osk-row"><div class="osk-key" onclick="typeKey('q')">Q</div><div class="osk-key" onclick="typeKey('w')">W</div><div class="osk-key" onclick="typeKey('e')">E</div><div class="osk-key" onclick="typeKey('r')">R</div><div class="osk-key" onclick="typeKey('t')">T</div><div class="osk-key" onclick="typeKey('z')">Z</div><div class="osk-key" onclick="typeKey('u')">U</div><div class="osk-key" onclick="typeKey('i')">I</div><div class="osk-key" onclick="typeKey('o')">O</div><div class="osk-key" onclick="typeKey('p')">P</div></div>

        <div class="osk-row"><div class="osk-key wide" onclick="typeKey('Shift')">⇧</div><div class="osk-key" onclick="typeKey('y')">Y</div><div class="osk-key" onclick="typeKey('x')">X</div><div class="osk-key" onclick="typeKey('c')">C</div><div class="osk-key" onclick="typeKey('v')">V</div><div class="osk-key" onclick="typeKey('b')">B</div><div class="osk-key" onclick="typeKey('n')">N</div><div class="osk-key" onclick="typeKey('m')">M</div><div class="osk-key wide" onclick="typeKey('Backspace')">⌫</div></div>

            <div class="digit" id="s2"><div class="digit-inner"><span>0</span><span>0</span></div></div>
        </div>

        <h1 class="title">9C</h1>

        <!-- Schnellzugriff -->

    <!-- Universal Modals -->
    <div id="dialog-overlay" class="modal-overlay">

    <!-- Server Sync -->
    <div id="sync-overlay" class="modal-overlay">
        <div class="modal-box" style="background:rgba(5,5,8,0.95);">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:20px;">
                <svg viewBox="0 0 24 24" width="50" fill="none" stroke="var(--accent-cyan)" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                <div style="flex-grow:1; height:6px; background:rgba(255,255,255,0.1); border-radius:5px; overflow:hidden; position:relative;">
                    <div style="width:50%; height:100%; background:var(--accent-purple); position:absolute; left:-50%; animation:syncMove 0.8s infinite linear;"></div>
                </div>
                <svg viewBox="0 0 24 24" width="50" fill="none" stroke="var(--accent-green)" stroke-width="1.5"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
            </div>
            <div style="margin-top:20px; font-weight:700; color:white;">Daten werden an den Server gesendet...</div>
        </div>
    </div>
    <style>@keyframes syncMove { 0% {left:-50%;} 100% {left:100%;} }</style>

    <script>
        document.getElementById('lbl-version').textContent = CONFIG_VERSION;
        document.getElementById('lbl-server').textContent = CONFIG_SERVER_INFO;
        
        let currentUser = null;
        let linksData = [];
        let editorData = [];
        let isDirty = false;
        let stTcTimer = null;
        let activeInput = null;

        // --- Hilfsfunktionen (Hashing, Cookies, Sicherheit) ---
        async function sha512(str) {
            const buf = await crypto.subtle.digest("SHA-512", new TextEncoder().encode(str));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }
        const setCookie = (n, v, d) => document.cookie = `${n}=${v || ""}; max-age=${d*86400}; path=/; SameSite=Strict`;
        const getCookie = n => document.cookie.split('; ').find(row => row.startsWith(n + '='))?.split('=')[1] || null;
        const deleteCookie = n => document.cookie = `${n}=; max-age=0; path=/`;
        const formatUsername = name => name.toLowerCase().replace(/(?:^|\s)\w/g, m => m.toUpperCase());
        const sanitizeHTML = str => str.replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t]));
        const sanitizeGistInput = str => sanitizeHTML(str.replace(/[;~\n\r]/g, ' ')).trim();

        // Performance Check (Lite Mode)
        let isLiteMode = false;
        let frames = 0; let lastTime = performance.now();
        let lagCheck = requestAnimationFrame(function check(time) {
            frames++;
            if(time - lastTime > 1000) {
                if(frames < 25 && !isLiteMode) document.body.classList.add('lite-mode'); // Auto Lite Mode on heavy lag
                cancelAnimationFrame(lagCheck);
            } else lagCheck = requestAnimationFrame(check);
        });

        // --- OSK Logic (On-Screen Keyboard) ---
        let shiftActive = false;
        document.addEventListener('contextmenu', e => {
            if (e.target.tagName === 'INPUT' && window.innerWidth > window.innerHeight) {
                e.preventDefault(); activeInput = e.target; document.getElementById('osk').classList.add('active');
            } else e.preventDefault();
        });
        function typeKey(char) {
            if(!activeInput) return;
            if(char === 'Backspace') { activeInput.value = activeInput.value.slice(0, -1); }
            else if(char === 'Shift') { shiftActive = !shiftActive; }
            else { activeInput.value += shiftActive ? char.toUpperCase() : char.toLowerCase(); shiftActive = false; }
            activeInput.focus();
        }
        function oskEnter() {
            document.getElementById('osk').classList.remove('active');
            if(activeInput) { const ev = new KeyboardEvent('keypress', {key: 'Enter'}); activeInput.dispatchEvent(ev); }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        // --- UHR LOGIK ---
        function updateClock() {
            if(window.innerHeight > window.innerWidth) return; 
            const d = new Date();
            const t = [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => n.toString().padStart(2, '0')).join('');
            ['h1','h2','m1','m2','s1','s2'].forEach((id, i) => {
                const char = t[i], el = document.getElementById(id), spans = el.querySelectorAll('span');
                if (spans[0].textContent !== char) {
                    spans[1].textContent = char;
                    el.querySelector('.digit-inner').style.transform = 'translateY(-1.1em)';
                    setTimeout(() => {
                        spans[0].textContent = char;
                        el.querySelector('.digit-inner').style.transition = 'none';
                        el.querySelector('.digit-inner').style.transform = 'translateY(0)';
                        setTimeout(() => el.querySelector('.digit-inner').style.transition = 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)', 20);
                    }, 400);
                }
            });
        }
        setInterval(updateClock, 1000); updateClock();

        // --- Custom Dialog ---
        const Dialog = {
            overlay: document.getElementById('dialog-overlay'), box: document.getElementById('dialog-box'),
            title: document.getElementById('dialog-title'), text: document.getElementById('dialog-text'),
            inputs: document.getElementById('dialog-input-container'), actions: document.getElementById('dialog-actions'),
            closeX: document.getElementById('dialog-close'), resolvePromise: null,

            open(cfg) {
                return new Promise(res => {
                    this.resolvePromise = res;
                    this.box.className = 'modal-box ' + (cfg.customClass || '');
                    this.title.textContent = cfg.title || ''; this.text.innerHTML = cfg.text || '';
                    this.inputs.innerHTML = ''; this.actions.innerHTML = '';
                    
                    if(cfg.showClose) { this.closeX.style.display = 'flex'; this.closeX.onclick = () => this.handleBtnClick('cancel'); } 
                    else this.closeX.style.display = 'none';

                    if (cfg.fields) {
                        cfg.fields.forEach((f, idx) => {
                            let w = document.createElement('div'); w.className = 'input-wrapper';
                            if(f.label) { let l = document.createElement('label'); l.textContent = f.label; l.style.color="var(--text-muted)"; l.style.display="block"; l.style.marginBottom="5px"; w.appendChild(l); }
                            let inp = document.createElement('input');
                            inp.type = f.type || 'text'; inp.className = 'modal-input';
                            inp.placeholder = f.placeholder || ''; inp.value = f.value || '';
                            inp.addEventListener('keypress', (e) => { if(e.key === 'Enter') { e.preventDefault(); this.submit(cfg.buttons); } });
                            w.appendChild(inp);
                            
                            if(f.type === 'password') {
                                let eye = document.createElement('div'); eye.className = 'eye-icon';
                                eye.innerHTML = `<svg viewBox="0 0 24 24" width="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
                                eye.onclick = () => { inp.type = inp.type === 'password' ? 'text' : 'password'; eye.style.color = inp.type === 'text' ? 'var(--accent-cyan)' : 'var(--text-muted)'; };
                                w.appendChild(eye);
                            }
                            this.inputs.appendChild(w);
                            if (idx === 0) setTimeout(() => inp.focus(), 50);
                        });
                    } else if (cfg.customHTML) this.inputs.innerHTML = cfg.customHTML;

                    if (cfg.buttons) {
                        cfg.buttons.forEach(b => {
                            let btn = document.createElement('button');
                            btn.className = 'modal-btn ' + (b.class || '');
                            btn.innerHTML = b.html || `<span class="btn-text-front">${b.text}</span>`;
                            btn.id = b.id || '';
                            btn.onclick = () => this.handleBtnClick(b.action);
                            this.actions.appendChild(btn);
                        });
                    }
                    this.overlay.classList.add('active');
                });
            },
            submit(buttons) {
                const primary = buttons.find(b => b.class && b.class.includes('primary')) || buttons[buttons.length-1];
                if(primary) this.handleBtnClick(primary.action);
            },
            handleBtnClick(action) {
                if (action === 'cancel') this.close(null);
                else if (action === 'ok') {
                    const inps = Array.from(this.inputs.querySelectorAll('input'));
                    if(inps.length === 1) this.close(inps[0].value);
                    else if(inps.length > 1) this.close(inps.map(i => i.value));
                    else this.close(true);
                } else if (typeof action === 'function') action(this);
            },
            close(val) {
                this.overlay.classList.remove('active'); document.getElementById('osk').classList.remove('active');
                setTimeout(() => { if (this.resolvePromise) { this.resolvePromise(val); this.resolvePromise = null; } }, 300);
            }
        };

        async function triggerServerSync(shortcut, payload, successMsg, callback) {
            const syncOverlay = document.getElementById('sync-overlay');
            syncOverlay.classList.add('active');
            try {
                const controller = new AbortController(); const timeoutId = setTimeout(() => controller.abort(), 10000);
                await fetch(PUSHCUT_BASE + shortcut + "&input=" + payload, { mode: 'no-cors', signal: controller.signal });
                clearTimeout(timeoutId);
                
                syncOverlay.classList.remove('active');
                setTimeout(() => {
                    if(successMsg) Dialog.open({ title: 'Erfolg', text: successMsg, buttons: [{text:'OK', class:'primary', action:'cancel'}]});
                    setTimeout(() => callback(), successMsg ? 2000 : 400); 
                }, 400);
            } catch(e) {
                syncOverlay.classList.remove('active');
                setTimeout(() => Dialog.open({ title: 'Fehler', text: 'Server Antwortet nicht!', buttons: [{text:'OK', class:'danger', action:'cancel'}] }), 400);
            }
        }

        // --- SCHNELLZUGRIFF LOGIK ---
        function showNCInfo() {
            Dialog.open({
                title: 'Next Cloud Info', showClose: true,
                text: 'Auf dieser Seite meldest du dich mit deinen Zugangsdaten an, welche du auch für die Schul Computer verwendest. Danach kannst du auf deine Dateien zugreifen.',
                buttons: [{text: 'Weiter zu Next Cloud', class: 'primary', action: () => { Dialog.close(); window.open('https://nc.schillerschuledettingen.de/nextcloud/login', '_blank'); }}]
            });
        }
        function getOSInstructions() {
            let ua = navigator.userAgent;
            if (/iPad|iPhone|iPod/.test(ua)) return "Textfeld gedrückt halten oder doppeltippen, dann auf <b>Einsetzen</b> tippen.";
            if (/Android/.test(ua)) return "Textfeld gedrückt halten und auf <b>Einfügen</b> tippen.";
            if (/Mac/.test(ua)) return "<b>CMD + V</b> drücken oder Rechtsklick -> <b>Einsetzen</b> wählen.";
            return "<b>STRG + V</b> drücken oder Rechtsklick -> <b>Einfügen</b> wählen.";
        }
        function showTaskcardsPopup() {
            Dialog.open({
                title: 'Weiterleitung zu Taskcards', showClose: true,
                text: `Du wirst im folgenden zu Taskcards weitergeleitet, im Passwort Feld musst du nur folgendes tun:<br><br><span style="color:var(--accent-cyan)">${getOSInstructions()}</span>`,
                buttons: [{text: 'Weiter zu Taskcards', class: 'primary', action: () => {
                    navigator.clipboard.writeText("9cEnglish2627").catch(()=>{});
                    Dialog.close(); window.open('https://www.taskcards.de/#/board/10eca93a-de74-456c-beaa-3841592ff1eb/view?token=75a6af1a-571e-47e7-bbc1-f26c6f9397c0', '_blank');
                }}]
            });
        }

        // --- SPEZIAL LINK (?st-tc) ---
        function showTeacherPopup() {
            Dialog.open({
                title: 'Hallo Frau Stephan!', showClose: true,
                text: 'Das Passwort wurde kopiert.<br><br><small style="color:var(--text-muted)" id="st-tc-hint">in 3sek. fortfahren...</small>',
                buttons: [{
                    text: 'Weiter zu Taskcards', class: 'primary btn-outline-progress', id: 'btn-st-tc',
                    html: '<div class="progress-fill" id="st-tc-prog"></div><span class="btn-text-front">Weiter zu Taskcards</span>',
                    action: () => executeTeacherForward()
                }]
            }).then(res => { if(res === null) cancelTeacherForward(); });

            // Trigger Animation
            setTimeout(() => { const p = document.getElementById('st-tc-prog'); if(p) p.style.width = '100%'; }, 50);

            stTcTimer = setTimeout(executeTeacherForward, 3000);

            Dialog.overlay.onclick = (e) => { if(e.target === Dialog.overlay) cancelTeacherForward(); };
            document.onkeydown = (e) => { if(e.key === 'Escape') cancelTeacherForward(); if(e.key === 'Enter') executeTeacherForward(); };
        }
        function cancelTeacherForward() {
            clearTimeout(stTcTimer);
            const p = document.getElementById('st-tc-prog'); if(p) p.style.width = '0%';
            const hint = document.getElementById('st-tc-hint'); if(hint) hint.textContent = 'Weiterleiten abgebrochen.';
            Dialog.overlay.onclick = null; document.onkeydown = null; Dialog.close(null);
        }
        function executeTeacherForward() {
            clearTimeout(stTcTimer); Dialog.overlay.onclick = null; document.onkeydown = null;
            navigator.clipboard.writeText("9cEnglish2627").catch(()=>{});
            window.location.href = 'https://www.taskcards.de/#/board/10eca93a-de74-456c-beaa-3841592ff1eb/view?token=75a6af1a-571e-47e7-bbc1-f26c6f9397c0';
        }

        // --- CHANGELOG BUBBLE LOGIK ---
        function checkChangelog() {
            if(CONFIG_CHANGELOG !== "ON" || window.innerWidth <= 768) return;
            // Wenn URL Parameter existieren, Changelog nicht zeigen
            if(window.location.search) return;

            fetch(GIST_CHANGELOG + "?t=" + Date.now())
                .then(res => res.text())
                .then(text => {
                    if(text.trim()) {
                        document.getElementById('cl-content').textContent = text.trim();
                        setTimeout(() => document.getElementById('cl-bubble').classList.add('show'), 1500);
                    }
                }).catch(() => document.getElementById('cl-content').textContent = "Keine Neuigkeiten.");
        }
        function closeChangelog() {
            document.getElementById('cl-bubble').classList.remove('show');
        }


        // --- AUTH & LOGIN LOGIK (Wiederhergestellt) ---
        document.getElementById('btn-user').onclick = async () => {
            if (currentUser) {
                if (currentUser === 'LOCAL') { Dialog.open({ title: 'Hinweis', text: 'Local-Passwort kann nicht geändert werden.', buttons: [{text:'OK', class:'primary', action:'cancel'}]}); return; }
                const change = await Dialog.open({ title: 'Passwort ändern', text: 'Möchtest du dein Passwort ändern?', buttons: [{ text: 'Abbrechen', action: 'cancel' }, { text: 'Ja', class: 'primary', action: 'ok' }] });
                if (change) showChangePassword();
            } else showLogin();
        };

        document.getElementById('btn-signout').onclick = () => { deleteCookie('9c_user'); currentUser = null; updateMenu(); showToast("Erfolgreich abgemeldet"); };

        async function showLogin() {
            const username = await Dialog.open({ title: 'Anmelden', fields: [{ placeholder: 'Benutzername' }], buttons: [{ text: 'Abbrechen', action: 'cancel' }, { text: 'Weiter', class: 'primary', action: 'ok' }] });
            if (!username) return;
            const uname = sanitizeHTML(username.trim().toUpperCase());
            const pwd = await Dialog.open({ title: 'Anmelden', fields: [{ placeholder: 'Passwort', type: 'password' }], buttons: [{ text: 'Abbrechen', action: 'cancel' }, { text: 'Anmelden', class: 'primary', action: 'ok' }] });
            if (!pwd) return;
            performLoginCheck(uname, pwd, false);
        }

        async function performLoginCheck(uname, plainPwd, isAutoLogin) {
            if (uname === 'LOCAL') {
                if(await sha512(plainPwd) === "08a06925eb603fb9d2caef4cbff40659a449ae3ac6ca26c561632c53e603e6825fb2bf9d4e863dc4f26d522cdc49690d66a509739e31f7ef060931a2ec042d64") loginSuccess(uname);
                else Dialog.open({ title: 'Fehler', text: 'Falsches Passwort!', buttons: [{ text: 'OK', class: 'danger', action: 'cancel' }] });
                return;
            }
            try {
                const users = (await (await fetch(GIST_USERS + "?t=" + Date.now())).text()).split('\n');
                let foundHash = null;
                for (let line of users) { let p = line.split(';'); if (p[0] === uname) { foundHash = p[1]?.trim() || null; break; } }

                if (foundHash === null) Dialog.open({ title: 'Fehler', text: 'Benutzer existiert nicht.', buttons: [{ text: 'OK', class: 'danger', action:'cancel'}] });
                else if (foundHash === '-') {
                    if(isAutoLogin) alert("Account muss erst eingerichtet werden!"); else showSetPassword(uname);
                }
                else if (await sha512(plainPwd) === foundHash) loginSuccess(uname);
                else Dialog.open({ title: 'Fehler', text: 'Falsches Passwort!', buttons: [{ text: 'OK', class: 'danger', action: 'cancel' }] });
            } catch (e) { Dialog.open({ title: 'Fehler', text: 'Netzwerkfehler.', buttons: [{text:'OK', class:'danger', action:'cancel'}]}); }
        }

        function loginSuccess(uname) {
            currentUser = uname; setCookie('9c_user', uname, 7); updateMenu(); loadLinks();
            showToast(`Angemeldet als: ${formatUsername(uname)}`);
        }

        async function showSetPassword(uname) {
            const pwd = await Dialog.open({ title: 'Account einrichten', fields: [{ placeholder: 'Neues Passwort', type: 'password' }], buttons: [{ text: 'Abbrechen', action: 'cancel' }, { text: 'Festlegen', class: 'primary', action: 'ok' }] });
            if (!pwd || pwd.length < 3) return;
            triggerServerSync(`9C-EDIT-REGISTER`, `${uname}%3B${await sha512(pwd)}`, "Passwort festgelegt!", () => loginSuccess(uname));
        }

        async function showChangePassword() {
            const pwd = await Dialog.open({ title: 'Passwort ändern', fields: [{ placeholder: 'Neues Passwort', type: 'password' }], buttons: [{ text: 'Abbrechen', action: 'cancel' }, { text: 'Ändern', class: 'primary', action: 'ok' }] });
            if (!pwd) return;
            triggerServerSync(`9C-CHANGE-PASS`, `${currentUser}%3B${await sha512(pwd)}`, "Passwort erfolgreich geändert.", () => {});
        }


        // --- Init ---
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('user') && urlParams.has('password')) {
                const u = urlParams.get('user'); const p = urlParams.get('password');
                window.history.replaceState({}, document.title, window.location.pathname); // Hide params
                performLoginCheck(u.toUpperCase(), p, true);
            } else if (window.location.search.includes('st-tc')) {
                showTeacherPopup();
            } else {
                const cUser = getCookie('9c_user');
                if(cUser) { currentUser = cUser; showToast(`Angemeldet als: ${currentUser}`); updateMenu(); }
                checkChangelog(); // Nur wenn normaler load
            }
            loadLinks();
        };

        function updateMenu() {
            document.getElementById('btn-edit').style.display = currentUser ? 'flex' : 'none';
            document.getElementById('btn-links-add').style.display = currentUser ? 'flex' : 'none';
            document.getElementById('btn-signout').style.display = currentUser ? 'flex' : 'none';
            
            const ulbl = document.getElementById('user-label');
            ulbl.textContent = currentUser ? formatUsername(currentUser) : 'Benutzer';
            document.getElementById('btn-user').style.color = currentUser ? 'var(--accent-cyan)' : 'white';
        }

        // --- EDITOR LOGIK (Wiederhergestellt) ---
        document.getElementById('btn-edit').onclick = () => { editorData = JSON.parse(JSON.stringify(linksData)); isDirty = false; renderEditor(); };
        
        function renderEditor() {
            let h = '<div class="editor-list">';
            editorData.forEach((l, i) => {
                h += `<div class="editor-item"><span>${sanitizeHTML(l.label)}</span>
                        <div class="editor-actions">
                            <button class="icon-btn" onclick="editItem(${i})"><svg viewBox="0 0 24 24" width="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
                            <button class="icon-btn delete" onclick="deleteItem(${i})"><svg viewBox="0 0 24 24" width="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6"/></svg></button>
                        </div></div>`;
            });
            h += '</div>';
            Dialog.open({
                title: 'Editor Modus', customClass: 'editor-mode', alignActions: 'right', customHTML: h,
                buttons: [ { text: 'Schließen', action: checkDirtyClose }, { text: 'Speichern', class: 'primary', action: saveGist } ]
            });
        }

        function editItem(i) {
            const it = editorData[i];
            Dialog.open({
                title: 'Bearbeiten', customClass: 'editor-mode',
                fields: [
                    { label: 'Label *', value: it.label }, { label: 'Passwort ("-" für keins)', value: it.password },
                    { label: 'Link ("X" zum deaktivieren) *', value: it.target }, { label: 'Hinweis (Optional)', value: it.popupText }
                ],
                buttons: [
                    { text: 'Abbrechen', action: renderEditor },
                    { text: 'Übernehmen', class: 'primary', action: dlg => {
                        const v = dlg.inputs.querySelectorAll('input');
                        const nL = sanitizeGistInput(v[0].value), nP = sanitizeGistInput(v[1].value)||'-', nT = sanitizeGistInput(v[2].value), nU = sanitizeGistInput(v[3].value);
                        if(!nL || !nT) { alert("Label & Link sind Pflicht!"); return; }
                        editorData[i] = {label:nL, password:nP, target:nT, popupText:nU};
                        isDirty = true; renderEditor();
                    }}
                ]
            });
        }
        function deleteItem(i) { editorData.splice(i, 1); isDirty = true; renderEditor(); }
        async function checkDirtyClose(dlg) {
            if(!isDirty) { dlg.close(); return; }
            const c = await Dialog.open({ title: 'Ungespeichert', text: 'Wirklich ohne Speichern schließen?', buttons: [{text:'Zurück', action:'cancel'}, {text:'Verwerfen', class:'danger', action:'ok'}]});
            if(c) { isDirty = false; Dialog.close(); } else renderEditor();
        }

        function saveGist(dlg) {
            if(!isDirty) { dlg.close(); return; }
            let lines = editorData.map(l => l.password !== '-' && l.password !== '' 
                ? `${l.label};-;\${l.password};-;\${l.target}${l.popupText ? ';' + l.popupText : ''}`
                : `${l.label};-;\${l.target}${l.popupText ? ';' + l.popupText : ''}`
            );
            triggerServerSync(`9C-EDIT-APPLY`, encodeURIComponent(lines.join('\n').replace(/\n/g, '~')), null, () => { dlg.close(); location.reload(); });
        }

        // --- QUICK ADD (9C-ADD) ---
        document.getElementById('btn-links-add').onclick = () => {
            Dialog.open({
                title: 'Neuen Button hinzufügen', showClose: true,
                fields: [
                    { label: 'Label *', placeholder: 'Name des Buttons' },
                    { label: 'Passwort ("-" für keins)', value: '-' },
                    { label: 'Link / Ziel *', placeholder: 'https://...' },
                    { label: 'Hinweis (Optional, "-" für keins)', value: '-' }
                ],
                buttons: [
                    { text: 'Abbrechen', action: 'cancel' },
                    { text: 'Hinzufügen', class: 'primary', action: dlg => {
                        const v = dlg.inputs.querySelectorAll('input');
                        const l = sanitizeGistInput(v[0].value), p = sanitizeGistInput(v[1].value)||'-', t = sanitizeGistInput(v[2].value), h = sanitizeGistInput(v[3].value)||'-';
                        if(!l || !t) { alert("Label und Link sind Pflicht!"); return; }
                        
                        const payload = encodeURIComponent(`${l};${p};${t};${h}`);
                        dlg.close();
                        triggerServerSync(`9C-ADD`, payload, "Button erfolgreich hinzugefügt!", () => location.reload());
                    }}
                ]
            });
        };

        // --- GIST DYNAMISCHE BUTTONS LADEN ---
        async function loadLinks() {
            const cont = document.getElementById('button-container'); cont.innerHTML = '';
            try {
                const text = await (await fetch(GIST_LINKS + "?t=" + Date.now())).text();
                linksData = [];
                text.split('\n').forEach(line => {
                    line = line.trim(); if(!line) return;
                    let parts = line.split(';-;');
                    if(parts.length < 2) return;
                    
                    let label = parts[0].trim(), pwd = '-', targetFull = '';
                    if (parts.length === 2) targetFull = parts[1].trim();
                    else { pwd = parts[1].trim() || '-'; targetFull = parts.slice(2).join(';-;').trim(); }

                    let target = targetFull, popupText = '';
                    let semi = targetFull.indexOf(';');
                    if(semi !== -1) { target = targetFull.substring(0, semi); popupText = targetFull.substring(semi + 1); }

                    linksData.push({ label, password: pwd, target, popupText });
                    const btn = document.createElement('button');
                    btn.className = 'glass-btn'; btn.textContent = label;
                    if (target.toUpperCase() === 'X') btn.disabled = true;
                    else btn.onclick = () => handleLinkClick(label, pwd, target, popupText);
                    cont.appendChild(btn);
                });
            } catch(e) { cont.innerHTML = '<p style="color:var(--danger); grid-column:1/-1; text-align:center;">Fehler beim Laden.</p>'; }
        }

        async function handleLinkClick(label, password, target, popupText) {
            if (password !== '-' && password !== '') {
                const input = await Dialog.open({
                    title: 'Geschützt', showClose: true, text: `Passwort für "${label}":`,
                    fields: [{ type: 'password', placeholder: 'Passwort' }],
                    buttons: [{ text: 'Abbrechen', action: 'cancel' }, { text: 'Entsperren', class: 'primary', action: 'ok' }]
                });
                if (!input) return;
                if (await sha512(input) !== password && input !== password) { 
                    Dialog.open({ title: 'Fehler', showClose: true, text: 'Falsches Passwort!', buttons: [{text:'OK', class:'danger', action:'cancel'}]}); 
                    return; 
                }
            }
            if (target.toLowerCase().startsWith('http')) {
                if (popupText && popupText !== '-') {
                    const ok = await Dialog.open({ title: label, showClose: true, text: popupText, buttons: [{text:'Abbrechen',action:'cancel'}, {text:'Weiter',class:'primary',action:'ok'}]});
                    if(ok) window.open(target, '_blank');
                } else window.open(target, '_blank');
            } else { Dialog.open({ title: label, showClose: true, text: target, buttons: [{text:'OK', class:'primary', action:'cancel'}] }); }
        }

    </script>
</body>
</html>
